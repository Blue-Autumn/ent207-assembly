<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'">
<title>Recognition speed test</title><link rel="stylesheet" href="tools.css">
<style>
#pane{padding-block:10px 24px}.sources{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-block:18px}
.sources figure{margin:0}.sources img{width:100%;height:92px;object-fit:contain;background:#e7ecdf;border-radius:14px}.sources figcaption{color:#586755;font-size:12px;margin-top:4px}
.settings-line{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
#run,#apply,#guide{width:100%;padding:13px 15px;min-height:46px;margin:5px 0;border-radius:16px;font-weight:650}
#run{background:#35543e;color:white}#rows{display:grid;gap:7px;margin:14px 0}
.measurement{background:#edf0e6;border-radius:14px;padding:11px 14px}.measurement strong{font-size:16px}.measurement small{display:block;margin-top:4px}#status{font-size:14px;min-height:20px;color:#50624e}
</style></head>
<body><main><header><button id="back" aria-label="Back">‹</button><h1 id="title"></h1></header>
<section id="pane"><p id="description"></p><div class="sources">
<figure><img id="photo" src="../field/blue-row.webp" alt=""><figcaption id="photo-label"></figcaption></figure>
<figure><img id="chart" src="camera-test-chart.webp" alt=""><figcaption id="chart-label"></figcaption></figure></div>
<label class="settings-line"><input type="checkbox" id="precision"><span id="opt-label"></span></label>
<button id="run"></button><p id="status" role="status"></p><div id="rows"></div><p id="comparison"></p>
<button id="apply" hidden></button><button id="guide" hidden></button></section></main><script src="camera-bench.js?v=5"></script></body></html>
