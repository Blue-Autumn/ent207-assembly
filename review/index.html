<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf9f3">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src blob:; worker-src 'self'; connect-src 'self' https://ent207-review.pages.dev; form-action 'none'; object-src 'none'; base-uri 'self'">
<title>AI photo review · Assembly Assistant</title><link rel="stylesheet" href="review.css?v=7"></head><body>
<header><button id="back" class="round" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><strong id="heading"></strong><span id="count"></span></header>
<main>
  <h1 id="task-name"></h1><p id="intro"></p>
  <section id="ask" hidden aria-label="DeepSeek">
    <div id="online-result" hidden aria-live="polite"><small id="cloud-source"></small><h2 id="cloud-title"></h2><p id="cloud-copy"></p></div>
    <div class="send-row"><button id="send" class="primary" type="button"></button><button id="ask-question" type="button" aria-expanded="false" aria-controls="question-box"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l4-1 10-10-3-3L6 15zM14.5 6.5l3 3"/></svg></button><button id="cancel-cloud" hidden type="button"></button></div>
    <div id="question-box" hidden><label id="question-label" for="question"></label><textarea id="question" rows="2" maxlength="400"></textarea></div>
    <p id="cloud-status" role="status"></p>
  </section>
  <section id="viewer" class="empty"><video id="live" autoplay muted playsinline hidden></video><img id="still" alt="" hidden><svg id="marks" aria-hidden="true" hidden></svg>
    <div id="camera-symbol" aria-hidden="true"><svg viewBox="0 0 36 36"><path d="M5 11h6l3-4h8l3 4h6v17H5z"/><circle cx="18" cy="19" r="5"/></svg></div>
    <small id="source-badge" hidden></small>
    <button id="overlay" class="tag" type="button" hidden></button><button id="expand" class="tag" type="button" hidden></button><button id="stop-live" class="tag" type="button" hidden></button>
  </section>
  <div class="tools-row"><nav id="thumbs" hidden></nav><div id="acquire"></div></div><div id="photo-menu" hidden></div>
  <section id="samples" hidden><h2 id="samples-title"></h2><div id="sample-list"></div></section>
  <p id="feedback" role="status"></p>
  <details id="result" hidden><summary><small id="local-label"></small><strong id="finding"></strong></summary><div class="local-detail"><p id="advice"></p><p id="row-readout" hidden></p><p id="limits" hidden></p><button id="retry" hidden></button></div></details>
</main>
<input type="file" id="pick" accept="image/*" multiple hidden>
<input type="file" id="system-camera" accept="image/*" capture="environment" hidden>
<script src="../guide/camera-input.js?v=6"></script><script type="module" src="review.js?v=7"></script>
</body></html>
