<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#f4f5fa"/><text x="46" y="30" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#6c577c">层板预装 · 2/2</text><text x="46" y="82" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="48" fill="#233047">先看拼好后的关系</text><text x="46" y="151" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#233047">下面是模型的最终拼合形状，不是插装动作。</text><rect x="42" y="1070" width="816" height="88" fill="#fff1d9" stroke="none" stroke-width="2"/><text x="64" y="1085" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#8c4a09">图解候选 · 先与实物核对，再用于指导</text><text x="64" y="1128" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#8c4a09">没有画插入箭头；不能按屏幕方向推压。</text><rect x="42" y="220" width="816" height="645" fill="#ffffff" stroke="none" stroke-width="2"/><text x="70" y="236" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#76548e">浅紫：半片1</text><text x="570" y="236" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="29" fill="#76548e">深紫：半片2</text><polygon points="102.174,638.835 102.917,637.633 103.905,636.623 105.092,635.856 119.335,628.734 120.521,627.967 121.509,626.957 122.252,625.756 122.713,624.420 122.869,623.016 122.869,566.984 122.713,565.580 122.252,564.244 121.509,563.043 120.521,562.033 119.335,561.266 105.092,554.144 103.905,553.377 102.917,552.367 102.174,551.165 101.713,549.830 101.557,548.426 101.557,349.918 102.410,349.918 208.053,349.918 214.508,349.918 214.965,346.721 212.834,346.721 214.508,335.000 216.639,335.000 271.987,335.000 271.987,349.918 442.541,349.918 442.541,403.197 463.852,381.885 463.852,467.131 442.541,445.820 442.541,573.689 463.852,552.