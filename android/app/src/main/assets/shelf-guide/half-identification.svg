<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#f4f5fa"/><text x="46" y="30" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#6c577c">层板预装 · 1/2</text><text x="46" y="82" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="48" fill="#233047">先认清这两半</text><text x="46" y="151" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#233047">紫色层：需要半片1和半片2各一件。</text><rect x="42" y="1070" width="816" height="88" fill="#fff1d9" stroke="none" stroke-width="2"/><text x="64" y="1085" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#8c4a09">图解候选 · 先与实物核对，再用于指导</text><text x="64" y="1128" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#8c4a09">没有画插入箭头；不能按屏幕方向推压。</text><rect x="42" y="220" width="396" height="600" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="462" y="220" width="396" height="600" fill="#ffffff" stroke="none" stroke-width="2"/><text x="76" y="242" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#233047">半片 1</text><text x="496" y="242" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="36" fill="#233047">半片 2</text><polygon points="85.507,585.012 86.143,583.984 86.989,583.120 88.004,582.463 100.193,576.369 101.208,575.712 102.054,574.848 102.689,573.820 103.084,572.677 103.217,571.475 103.217,523.525 103.084,522.323 102.689,521.180 102.054,520.152 101.208,519.288 100.193,518.631 88.004,512.537 86.989,511.880 86.143,511.016 85.507,509.988 85.113,508.845 84.980,507.643 84.980,337.766 85.709,337.766 176.115,337.766 181.639,337.766 182.030,335.031 180.206,335.031 181.639,325.000 183.463,325.000 230.828,325.000 230.828,337.766 376.783,337.766 376.783,383.361 395.020,365.123 395.020,438.074 376.783,419.836 376.783,529.262 395.020,511.025 395.020,583.975 376.783,565.738 376.783,675.164 395.020,656.926 395.020,729.877 376.783,711.639 376.783,757.234 230.828,757.234 230.828,770.000 183.463,770.000 181.639,770.000 179.816,757.234 176.115,757.234 85.709,757.234 84.980,757.234 84.980,587.357 85.113,586.155 85.507,585.012" fill="#bda4d8" stroke="#533c74" stroke-width="3" stroke-linejoin="round"/><polygon points="507.715,675.164 507.715,565.738 525.953,583.975 525.953,511.025 507.715,529.262 507.715,419.836 525.953,438.074 525.953,365.123 507.715,383.361 507.715,337.766 657.928,337.766 659.752,325.000 661.576,325.000 708.941,325.000 708.941,337.766 799.518,337.766 799.518,401.587 799.509,401.587 799.509,405.288 812.285,407.113 812.285,408.936 812.285,456.311 799.518,456.311 799.518,638.689 812.285,638.689 812.285,686.052 812.285,687.876 799.509,689.701 799.509,693.402 799.518,693.402 799.518,757.234 708.941,757.234 708.941,770.000 661.576,770.000 659.752,770.000 657.928,757.234 507.715,757.234 507.715,711.639 525.953,729.877 525.953,656.926 507.715,675.164" fill="#9275b4" stroke="#533c74" stroke-width="3" stroke-linejoin="round"/><text x="60" y="846" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#233047">标签 4 / 5 → 同一件两面</text><text x="480" y="846" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="28" fill="#233047">标签 6 / 7 → 同一件两面</text><text x="60" y="902" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#233047">看清边缘的凸起和缺口；不要只凭左右猜编号。</text><text x="60" y="952" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="30" fill="#233047">层板正反都可以装；A/B码不表示装配对错。</text><text x="60" y="1002" dominant-baseline="text-before-edge" font-family="Microsoft YaHei,sans-serif" font-size="27" fill="#59657a">图中深浅仅为分清两件，实物都应为紫色。</text></svg>