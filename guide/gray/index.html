<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gray frame joint</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font:15px/1.5 Roboto,system-ui,sans-serif;color:#272b21;background:#faf9f3}
main{max-width:540px;margin:auto;padding:8px 4px 16px}h1{font-size:21px;letter-spacing:-.025em;margin:0 0 5px}.minor,small{color:#5d6959}p{margin:4px 0 10px}
nav{display:flex;gap:4px;background:#e9ebe3;padding:3px;border-radius:15px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}nav button{font-size:14px;flex:1;min-height:40px;border:0;border-radius:12px;background:transparent}nav button[aria-pressed=true]{background:#fffefa;box-shadow:0 1px 4px #29352529}
figure{position:relative;overflow:hidden;margin:0;background:#e5e9df;border-radius:14px}img,canvas{display:block;width:100%;height:auto;aspect-ratio: 1.68;object-fit:contain}
figcaption{padding:7px 10px;color:#465640;font-size:12px}h2{font-size:18px;margin:13px 0 3px}#action{border:0;background:#304b3d;color:#fff;border-radius:22px;min-height:44px;width:100%;padding:9px 12px;font-weight:600}button:focus-visible{outline:2px solid #936b2d;outline-offset:-3px}
[hidden]{display:none!important}
</style><link rel="stylesheet" href="../../feedback.css?v=8"></head><body><main>
<h1 id="title"></h1><p class="minor" id="intro"></p><nav id="chooser"></nav>
<figure><img id="photo" alt=""><canvas id="stage" role="img" hidden></canvas><figcaption id="caption"></figcaption></figure>
<div aria-live="polite"><h2 id="finding"></h2><p id="why"></p></div>
<button id="action"></button><small id="rule"></small></main><script src="../work-surface.js?v=8"></script><script src="lesson.js?v=8"></script></body></html>
